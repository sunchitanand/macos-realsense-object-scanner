name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install shell checker
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Lint
        run: ruff check .

      - name: Check scripts
        run: |
          node --check object_scanner/static/app.js
          zsh -n run_object_scanner.sh run_object_scanner_demo.sh \
            scripts/install_realsense_macos.sh scripts/install_camera_worker_macos.sh

      - name: Test
        run: pytest
