name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install shell checker
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Lint
        run: ruff check .

      - name: Check scripts
        run: |
          node --check object_scanner/static/app.js
          zsh -n run_object_scanner.sh run_object_scanner_demo.sh \
            scripts/install_realsense_macos.sh scripts/install_camera_worker_macos.sh

      - name: Test
        run: pytest
